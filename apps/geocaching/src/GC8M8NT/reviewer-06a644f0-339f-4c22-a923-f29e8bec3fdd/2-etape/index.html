<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
</head>

<body>

<div style="margin-bottom: 20px;">
	<select id="iterator">
		<option value="">Choisir le numéro du pixel à traiter</option>
		<option value="1">1</option>
		<option value="2">2</option>
		<option value="3">3</option>
		<option value="4">4</option>
		<option value="5">5</option>
		<option value="6">6</option>
		<option value="7">7</option>
		<option value="8">8</option>
	</select>
</div>

<canvas id="c"></canvas>
<canvas id="qr"></canvas>



<script
	src="https://code.jquery.com/jquery-3.4.1.min.js"
	integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo="
	crossorigin="anonymous"></script>

<script>

$(function () {

	$('#iterator')
	.on('change', function () {

		if ($(this).val() !== '') {

			var c = document.getElementById("c");
			var ctx = c.getContext("2d");

			var c_qr = document.getElementById("qr");
			var ctx_qr = c_qr.getContext("2d");

			let qrIteration = parseInt($(this).val(), 10);

			var imageObj = new Image();

			imageObj.onload = function() {
				
				var colCount = qrIteration === 2 ? 29 : 25;
				var rowCount = qrIteration === 2 ? 29 : 25;
				var zoneSize = 10;
				var output = [];

				c.width = colCount * zoneSize;
				c.height = rowCount * zoneSize;
				ctx.drawImage(imageObj, 0, 0, colCount * zoneSize, rowCount * zoneSize);

				// Get the pixels RGBA values from first zone size
				for (var y = 0; y < (colCount * zoneSize); y += zoneSize) {
					
					let row = [];

					for (var x = 0; x < (colCount * zoneSize); x += zoneSize) {
						
						let xPos = x + qrIteration;
						let yPos = y + qrIteration;
						let xWidth = 1;
						let yWidth = 1;

						let rgba = ctx.getImageData(xPos, yPos, xWidth, yWidth).data;
						// let bin = (rgba[0] + rgba[1] + rgba[2]);
						
						// ctx.fillStyle = "blue";
						// ctx.fillRect(xPos, yPos, xWidth, yWidth);

						if(rgba[0] + rgba[1] + rgba[2] < 10) {
							row.push(0);
						} else {
							row.push(1);
						}
					}
					output.push(row);
				}

				c_qr.width = colCount * zoneSize;
				c_qr.height = rowCount * zoneSize;

				for (var y = 0; y < output.length; y++) {
					for (var x = 0; x < output[y].length; x++) {
						let xPos = x * zoneSize;
						let yPos = y * zoneSize;
						let xWidth = 10;
						let yWidth = 10;
						
						if (output[y][x] === 0) {
							ctx_qr.fillStyle = "black";
						} else {
							ctx_qr.fillStyle = "white";
						}
						
						ctx_qr.fillRect(xPos, yPos, xWidth, yWidth);
					}
				}

			};
		
			imageObj.src = qrIteration === 2 ? "qr_last2.png" : "qr_last.png";
		}
	});
	

})


</script>
</body>

</html>
