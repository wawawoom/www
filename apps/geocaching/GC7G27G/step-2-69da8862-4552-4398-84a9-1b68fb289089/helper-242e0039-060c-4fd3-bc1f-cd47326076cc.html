<body>
<canvas id="myCanvas" width="270" height="270" style="border:1px solid #000000;">

<script>
var a = [
	'000000000000000000000000000',
	'011111110101010100011111110',
	'010000010011111000010000010',
	'010111010111001000010111010',
	'010111010111010111010111010',
	'010111010100111111010111010',
	'010000010001100101010000010',
	'011111110101010101011111110',
	'000000000001010100000000000',
	'011110010101110111100111010',
	'001111100001011001001000100',
	'010110111111111101011000000',
	'000010101011001110110011000',
	'001000010011011100110101110',
	'000001101000111110111100010',
	'001110010001101101110101100',
	'010110100000100111101100010',
	'000111110000010111111111110',
	'000000000111000001000101010',
	'011111110011001101010101110',
	'010000010011101111000100000',
	'010111010001001101111110100',
	'010111010100000001010111110',
	'010111010101000110110101100',
	'010000010101111100110101000',
	'011111110101100000001111110',
	'000000000000000000000000000'
]

var b = [];

for (var i = 0; i < a.length; i++) {
	b.push(a[i].split(''));
}

var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");

for (var i = 0; i < b.length; i++) {
	for (var j = 0; j < b[i].length; j++) {
		if (b[i][j] == '1') {
			ctx.fillRect((j*10), (i*10), 10, 10);
		}	
	}
}
</script>

<img src="http://www.wawawoom.fr/geocaching/analytics/analytics.php" />

</body>

</html>
