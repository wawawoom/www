<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Title of the document</title>
</head>

<body>

<canvas id="c" style="display: none;"></canvas>
<canvas id="mycanvas"></canvas>
<canvas id="mycanvasG"></canvas>

<script>

var c = document.getElementById("c");
var ctx = c.getContext("2d");

var w = 726;
var ws = 22; // 33 cols
var cols = w / ws;

var h = 660;
var hs = 20;  // 33 rows
var rows = h / hs;

var totalPixels = cols * rows;

var output = [];

var imageObj = new Image();

imageObj.onload = function() {
	c.width = w;
	c.height = h;
	ctx.drawImage(imageObj, 0, 0, w, h);

	for (var y = 0; y < rows; y++) {
		for (var x = 0; x < cols; x++) {
			let rgba = ctx.getImageData((x * ws), (y * hs), 1, 1).data;
			output.push({
				r: rgba[0],
				g: rgba[1],
				b: rgba[2],
				a: rgba[3]
			});
		}
	}
	
	// Here the output array id filled
	var canvas = document.getElementById("mycanvas");
	var context = canvas.getContext("2d");
	canvas.width = w;
	canvas.height = h;

	var currentPos = {
		x: 330,
		y: 320
	}

	var directions = {};
	
	var lastChangeDirectionIndex = 3;
	var inc = 2;
	var j = 0;

	// Fill directions object
	for (var i = 1; i < totalPixels; i++) {
		if (i <= 3) {
			directions[i] = null;
		} else {
			if (i == (lastChangeDirectionIndex + inc)) {
				j++;
				directions[i] = null;
				lastChangeDirectionIndex = i;

				if (j === 2) {
					inc++;
					j = 0;
				}
			}
		}
	}

	// File directions
	var k = 0;
	for (key in directions) {
		if (k === 0) { directions[key] = 'right'; k++; }
		else if (k === 1) { directions[key] = 'up';  k++; }
		else if (k === 2) { directions[key] = 'left';  k++; }
		else if (k === 3) { directions[key] = 'down'; k = 0;}
	}

	var direction = directions[1];

	let move = {
		right: {
			xMove: ws,
			yMove: 0
		},
		up: {
			xMove: 0,
			yMove: -hs
		},
		left: {
			xMove: -ws,
			yMove: 0
		},
		down: {
			xMove: 0,
			yMove: hs
		}
	}

	var drawSquare = function (i) {

		var r = output[i].r;
		var g = output[i].g;
		var b = output[i].b;
		var a = output[i].a;
		context.fillStyle = "rgba(" + r + "," + g + "," + b + "," + a + ")";
		
		if (directions[i]) {
			direction = directions[i];
		}

		currentPos = {
			x: currentPos.x + move[direction].xMove,
			y: currentPos.y + move[direction].yMove,
		}

		var x = currentPos.x;
		var y = currentPos.y;
		context.fillRect(x, y, ws, hs);
		
	}

	for (let i = 0; i < 1089; i++) {
		drawSquare(i);
		//setTimeout(function() { drawSquare(i) }, i*5);
	}

	// Here the gradient image is rebuilt
	// I need to get the RBGA values in the order
	// Of the generated gradient image
	
	var rgbaOutput = [];
	for (var y = 0; y < rows; y++) {
		for (var x = 0; x < cols; x++) {
			let rgba = context.getImageData(x * ws, y * hs, 1, 1).data;
			rgbaOutput.push({
				r: rgba[0],
				g: rgba[1],
				b: rgba[2],
				a: rgba[3]
			});
		}
	}

	// Draw QRCODE on canal G
	var canvasG = document.getElementById("mycanvasG");
	var contextG = canvasG.getContext("2d");
	canvasG.width = w;
	canvasG.height = h;

	rowFlag = 0;
	colFlag = 0;
	for (let m = 0; m < rgbaOutput.length; m++) {
		
		//console.log(rgbaOutput[m].g % 7);

		if ( m > 0 && m % 33 === 0) {
			rowFlag++;
			colFlag = 0;
		}
		if (rgbaOutput[m].g % 7 === 1) {
			contextG.fillStyle = "rgba(0,0,0,1)";
			contextG.fillRect(colFlag * ws, rowFlag * hs, ws, hs);
		}
		colFlag++;
	}

};

imageObj.src = "etape1.png";

</script>
</body>

</html>
