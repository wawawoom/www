<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Sizing</title>
    <link rel="stylesheet" href="../_css/main.css" />
    <style>
      textarea {
        field-sizing: content;
        width: 100%;
        margin-top: 1rem;
        min-height: 50px;
      }
    </style>
  </head>

  <body>
    <a class="backToHome" href="/lab">&lt;</a>

    <div class="container">
      <h1>Field Sizing</h1>

      <hr />

      <code>textarea { field-sizing: content; }</code>

      <hr />

      <section>
        <form>
          <label for="message">Message</label>
          <textarea id="message" name="message"></textarea>
        </form>
      </section>
    </div>
  </body>
</html>
