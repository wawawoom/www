<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game of Life</title>
    <link rel="stylesheet" href="../_css/main.css" />
    <style>
      .gameOfLifeSection {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      body {
        background-color: var(--gray-1000);
      }

      h1 {
        color: var(--gray-400);
      }

      .backToHome:hover {
        color: var(--gray-200);
        border-color: var(--gray-200);
      }

      #c {
        margin: 0 auto;
      }
    </style>
  </head>

  <body>
    <a class="backToHome" href="../">&lt;</a>

    <div class="container">
      <h1 id="h1">Game of Life</h1>

      <section class="gameOfLifeSection">
        <canvas id="c"></canvas>
      </section>
    </div>
  </body>

  <script>
    const h = ((el) =>
      el.offsetHeight +
      parseFloat(getComputedStyle(el).marginTop) +
      parseFloat(getComputedStyle(el).marginBottom))(
      document.querySelector("h1")
    );

    const CELL_SIZE = 4;
    const COLOR_CELL = "#b0b0b0";
    const COLOR_BACKGROUND = "#000000";
    const FORM = "SQUARE";
    const ROW_COUNT = Math.floor((window.innerHeight - h - 10) / CELL_SIZE);
    const COL_COUNT = Math.floor((window.innerWidth - 20) / CELL_SIZE);

    let CANVAS;
    let CTX;
    let MATRIX = [];
    let MATRIX_TEMP = [];
    let changedCells = [];
    let animationId = null;
    let lastUpdateTime = 0;
    const INTERVAL = 50;
    const PERCENT_OF_LIFE = 0.3;

    const randomRainbow = () => {
      const o = Math.round;
      const r = Math.random;
      const redRange = 0;
      const greenRange = 0;
      const blueRange = 0;
      return (
        "rgb(" +
        o(r() * redRange) +
        "," +
        o(r() * greenRange) +
        "," +
        o(r() * blueRange) +
        ")"
      );
    };

    const initCanvas = () => {
      CANVAS = document.getElementById("c");
      // Optimisation : willReadFrequently: false pour de meilleures performances
      CTX = CANVAS.getContext("2d", { willReadFrequently: false });
      CANVAS.width = CELL_SIZE * COL_COUNT;
      CANVAS.height = CELL_SIZE * ROW_COUNT;
      // Optimisation : désactiver l'image smoothing pour de meilleures performances
      CTX.imageSmoothingEnabled = false;
    };

    const initMatrix = () => {
      for (let i = 0; i < ROW_COUNT; i++) {
        MATRIX[i] = new Array(COL_COUNT).fill(false);
      }
    };

    const initMatrixTemp = () => {
      for (let i = 0; i < ROW_COUNT; i++) {
        MATRIX_TEMP[i] = new Array(COL_COUNT).fill(false);
      }
    };

    // Optimisation : utiliser fillRect directement (plus rapide que beginPath/rect/fill)
    // Cache la couleur actuelle pour éviter les changements inutiles
    let currentColor = "";
    const drawCell = (x, y, color) => {
      if (currentColor !== color) {
        CTX.fillStyle = color;
        currentColor = color;
      }
      if (FORM === "SQUARE") {
        CTX.fillRect(x, y, CELL_SIZE, CELL_SIZE);
      } else if (FORM === "CIRCLE") {
        CTX.beginPath();
        CTX.arc(
          x + CELL_SIZE / 2,
          y + CELL_SIZE / 2,
          CELL_SIZE / 2,
          0,
          2 * Math.PI,
          false
        );
        CTX.fill();
      }
    };

    const fillRandomMatrix = () => {
      for (let i = 0; i < ROW_COUNT; i++) {
        for (let j = 0; j < COL_COUNT; j++) {
          MATRIX[i][j] = Math.random() < PERCENT_OF_LIFE;
        }
      }
    };

    const drawLife = () => {
      // Optimisation : ne redessiner que les cellules qui ont changé
      if (changedCells.length === 0) return;

      // Optimisation : grouper les dessins par couleur pour réduire les changements de fillStyle
      const aliveCells = [];
      const deadCells = [];

      for (const { row, col, isAlive } of changedCells) {
        if (isAlive) {
          aliveCells.push({ row, col });
        } else {
          deadCells.push({ row, col });
        }
      }

      // Dessiner d'abord toutes les cellules mortes
      if (deadCells.length > 0) {
        CTX.fillStyle = COLOR_BACKGROUND;
        currentColor = COLOR_BACKGROUND;
        for (const { row, col } of deadCells) {
          CTX.fillRect(col * CELL_SIZE, row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      }

      // Puis toutes les cellules vivantes
      if (aliveCells.length > 0) {
        const aliveColor = COLOR_CELL; // Utiliser la couleur blanche pour les cellules vivantes
        CTX.fillStyle = aliveColor;
        currentColor = aliveColor;
        for (const { row, col } of aliveCells) {
          CTX.fillRect(col * CELL_SIZE, row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      }

      changedCells.length = 0; // Vider le tableau
    };

    const initEvents = () => {
      // Cache les positions du canvas pour éviter les recalculs
      let canvasLeft = CANVAS.offsetLeft + CANVAS.clientLeft;
      let canvasTop = CANVAS.offsetTop + CANVAS.clientTop;

      CANVAS.addEventListener(
        "mousemove",
        (event) => {
          const colIndex = Math.floor((event.pageX - canvasLeft) / CELL_SIZE);
          const rowIndex = Math.floor((event.pageY - canvasTop) / CELL_SIZE);

          // Vérifier les limites et éviter les mises à jour inutiles
          if (
            rowIndex >= 0 &&
            rowIndex < ROW_COUNT &&
            colIndex >= 0 &&
            colIndex < COL_COUNT &&
            !MATRIX[rowIndex][colIndex]
          ) {
            MATRIX[rowIndex][colIndex] = true;
            // Optimisation : utiliser directement fillRect avec la couleur en cache
            const aliveColor = COLOR_CELL;
            if (currentColor !== aliveColor) {
              CTX.fillStyle = aliveColor;
              currentColor = aliveColor;
            }
            CTX.fillRect(
              colIndex * CELL_SIZE,
              rowIndex * CELL_SIZE,
              CELL_SIZE,
              CELL_SIZE
            );
          }
        },
        false
      );
    };

    const getSurrondings = (x, y) => {
      // Optimisation : utiliser modulo pour gérer les bordures toriques
      // Précalculer les indices pour éviter les accès répétés
      const prevX = (x - 1 + ROW_COUNT) % ROW_COUNT;
      const nextX = (x + 1) % ROW_COUNT;
      const prevY = (y - 1 + COL_COUNT) % COL_COUNT;
      const nextY = (y + 1) % COL_COUNT;

      // Optimisation : utiliser des variables locales pour éviter les accès répétés à MATRIX
      const rowPrevX = MATRIX[prevX];
      const rowX = MATRIX[x];
      const rowNextX = MATRIX[nextX];

      let count = 0;
      if (rowPrevX[prevY]) count++;
      if (rowX[prevY]) count++;
      if (rowNextX[prevY]) count++;
      if (rowPrevX[y]) count++;
      if (rowNextX[y]) count++;
      if (rowPrevX[nextY]) count++;
      if (rowX[nextY]) count++;
      if (rowNextX[nextY]) count++;

      return count;
    };

    const updateLife = () => {
      // Optimisation : réutiliser MATRIX_TEMP au lieu de le recréer
      // Utiliser fill() pour réinitialiser plus rapidement
      for (let i = 0; i < ROW_COUNT; i++) {
        MATRIX_TEMP[i].fill(false);
      }

      // Collecter les changements au lieu de tout redessiner
      changedCells.length = 0;

      // Optimisation : utiliser des variables locales pour éviter les accès répétés
      for (let i = 0; i < ROW_COUNT; i++) {
        const row = MATRIX[i];
        const tempRow = MATRIX_TEMP[i];

        for (let j = 0; j < COL_COUNT; j++) {
          const surrondings = getSurrondings(i, j);
          const currentState = row[j];

          // Optimisation : simplifier la logique
          const newState =
            (currentState && (surrondings === 2 || surrondings === 3)) ||
            (!currentState && surrondings === 3);

          tempRow[j] = newState;

          // Seulement ajouter à changedCells si l'état a changé
          if (currentState !== newState) {
            changedCells.push({ row: i, col: j, isAlive: newState });
          }
        }
      }

      // Optimisation : échanger les matrices au lieu de cloner (beaucoup plus rapide)
      const temp = MATRIX;
      MATRIX = MATRIX_TEMP;
      MATRIX_TEMP = temp;
    };

    initCanvas();
    initMatrix();
    initMatrixTemp();
    fillRandomMatrix();

    updateLife();
    drawLife();

    // Optimisation : utiliser requestAnimationFrame au lieu de setInterval
    const animate = (currentTime) => {
      if (currentTime - lastUpdateTime >= INTERVAL) {
        updateLife();
        drawLife();
        lastUpdateTime = currentTime;
      }
      animationId = requestAnimationFrame(animate);
    };

    lastUpdateTime = performance.now();
    animationId = requestAnimationFrame(animate);
  </script>
</html>
