<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Balance</title>
    <!-- Geist Font -->
    <link rel="stylesheet" href="../_css/main.css" />
    <style>
      h2 {
        width: 60%;
        border: 1px solid #e4e4e4;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 22px 0 rgba(24, 25, 32, 0.11),
          0 1.5px 6px 0 rgba(24, 25, 32, 0.07);
        font-size: 3rem;
        margin: 0 auto;
      }
    </style>
  </head>

  <body>
    <a class="backToHome" href="/lab">&lt;</a>

    <div class="container">
      <h1>Text Balance</h1>

      <hr />

      <label
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 1.5em;
          font-size: 1.15em;
          cursor: pointer;
        "
      >
        <input type="checkbox" id="toggle-balance" style="accent-color: #222" />
        Activer <code>text-wrap: balance</code>
      </label>

      <hr />

      <h2>
        This is a test of the text-balance feature. It should be balanced.
      </h2>
    </div>
    <script>
      const checkbox = document.getElementById('toggle-balance');
      const h2 = document.querySelector('h2');

      // initial state: checked
      checkbox.addEventListener('change', function () {
        if (this.checked) {
          h2.style.textWrap = 'balance';
        } else {
          h2.style.textWrap = '';
        }
      });
    </script>
  </body>
</html>
