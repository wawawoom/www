<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Display</title>
    <link rel="stylesheet" href="../_css/main.css" />
    <style>
      .box {
        display: inline flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 3px;
        border: 1px solid #e4e4e4;
        padding: 5px;
        border-radius: 5px;
      }
    </style>
  </head>

  <body>
    <a class="backToHome" href="/lab">&lt;</a>

    <div class="container">
      <h1>Multi Display</h1>

      <hr />

      <a
        href="https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_display/multi-keyword_syntax_of_display"
        target="_blank"
        >🔗</a
      >
      <code>display: inline flex;</code>

      <hr />

      <section>
        <div class="box">
          <span>Box 1</span><span>A</span><span>B</span><span>C</span>
        </div>
        <div class="box">
          <span>Box 2</span><span>A</span><span>B</span><span>C</span>
        </div>
        <div class="box">
          <span>Box 3</span><span>A</span><span>B</span><span>C</span>
        </div>
        <div class="box">
          <span>Box 4</span><span>A</span><span>B</span><span>C</span>
        </div>
        <div class="box">
          <span>Box 5</span><span>A</span><span>B</span><span>C</span>
        </div>
        <div class="box">
          <span>Box 6</span><span>A</span><span>B</span><span>C</span>
        </div>
        <div class="box">
          <span>Box 7</span><span>A</span><span>B</span><span>C</span>
        </div>
      </section>
    </div>
  </body>
</html>
